name: DHNA Data Pipeline CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    # Task 1: Code Linting
    - name: Install linting tools
      run: |
        pip install flake8 black
    
    - name: Run Flake8 Linter
      run: |
        echo "Running Flake8 linter..."
        flake8 data_prep_FIXED.py --max-line-length=100 --statistics
        echo "✓ Linting passed!"
      continue-on-error: false
    
    - name: Check code formatting with Black
      run: |
        echo "Checking code formatting..."
        black --check data_prep_FIXED.py --line-length=100
        echo "✓ Code formatting check passed!"
      continue-on-error: false
    
    # Task 2: Unit Testing
    - name: Install testing dependencies
      run: |
        pip install pytest pytest-cov pandas numpy
    
    - name: Run Unit Tests
      run: |
        echo "Running unit tests..."
        pytest test_pipeline.py -v --cov=. --cov-report=term-missing
        echo "✓ All tests passed!"
    
    # Task 3: Build Automation (Validation Build)
    - name: Install project dependencies
      run: |
        echo "Installing project dependencies..."
        pip install -r requirements.txt
    
    - name: Validate Pipeline Script
      run: |
        echo "Validating data_prep_FIXED.py can be imported..."
        python -c "import py_compile; py_compile.compile('data_prep_FIXED.py', doraise=True)"
        echo "✓ Script validation passed!"
    
    - name: Build Success
      run: |
        echo "=========================================="
        echo "✓ CI Pipeline completed successfully!"
        echo "  - Linting: PASSED"
        echo "  - Testing: PASSED"
        echo "  - Build: PASSED"
        echo "=========================================="
