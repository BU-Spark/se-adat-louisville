name: ADAT CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  python-ci:
    name: Python Module Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install testing dependencies
      run: |
        cd ci-pipeline
        pip install pytest pytest-cov numpy
    
    - name: Run Unit Tests
      run: |
        cd ci-pipeline
        pytest test_data_prep.py -v --cov=data_prep_simple
    
    - name: Validate Python Module
      run: |
        cd ci-pipeline
        python -c "import py_compile; py_compile.compile('data_prep_simple.py', doraise=True)"

  astro-ci:
    name: Astro Project Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: npm install
    
    - name: Run ESLint
      run: npm run lint
      continue-on-error: true  # Won't fail if linting has issues