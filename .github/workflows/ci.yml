name: ADAT CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    # Skip Python linting since this is an Astro project
    
    # Task 1: Unit Testing (Python module only)
    - name: Install testing dependencies
      run: |
        cd ci-pipeline
        pip install pytest pytest-cov numpy
    
    - name: Run Unit Tests
      run: |
        cd ci-pipeline
        echo "Running unit tests..."
        pytest test_data_prep.py -v --cov=data_prep_simple --cov-report=term-missing
        echo "✓ All tests passed!"
    
    # Task 2: Build Automation (Validation Build)
    - name: Install project dependencies
      run: |
        cd ci-pipeline
        echo "Installing project dependencies..."
        pip install -r requirements.txt
    
    - name: Validate Python Script
      run: |
        cd ci-pipeline
        echo "Validating data_prep_simple.py can be imported..."
        python -c "import py_compile; py_compile.compile('data_prep_simple.py', doraise=True)"
        echo "✓ Script validation passed!"
    
    - name: Build Success
      run: |
        echo "=========================================="
        echo "✓ CI Pipeline completed successfully!"
        echo "  - Testing: PASSED"
        echo "  - Build: PASSED"
        echo "=========================================="
